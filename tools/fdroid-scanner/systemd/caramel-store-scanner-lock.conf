# Drop-in for an existing user-level scanner service. Both the scanner and the
# metadata refresher then serialize on the same state-directory lock.
[Service]
ExecStart=
ExecStart=/usr/bin/flock -n %h/.local/state/caramel-store-scanner/scanner.lock /usr/bin/python3 %h/caramel-store-scanner/scan.py --config %h/caramel-store-scanner/scanner-config.json
